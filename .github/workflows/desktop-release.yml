name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Desktop ${{ matrix.slug }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            slug: windows-x86_64
            exe: .exe
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            slug: macos-x86_64
            exe: ''
          - runner: macos-15
            target: aarch64-apple-darwin
            slug: macos-arm64
            exe: ''
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            slug: linux-x86_64
            exe: ''
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            slug: linux-arm64
            exe: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Keep this version equal to rust-toolchain.toml (ADR 0049).
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version 2.12.4 --locked
      - name: Check version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python tools/release_desktop.py version --tag "$GITHUB_REF_NAME"
          else
            python tools/release_desktop.py version
          fi
      - name: Check notes
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          # A candidate after 0.1.0-rc.9 needs its notes file (ADR 0100 items 1, 4 and 7).
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^0\.1\.0-rc\.[1-9]$ && ! -s "docs/releases/$version.md" ]]; then
            echo "ADR 0100 item 4: the tag $GITHUB_REF_NAME needs the notes file docs/releases/$version.md. Commit it on main, then make a new candidate." >&2
            exit 1
          fi
      - name: Install Linux packages
        if: startsWith(matrix.slug, 'linux-')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Install Linux test server
        if: matrix.slug == 'linux-x86_64'
        run: sudo apt-get install -y openssh-server
      - name: Run repository checks
        if: matrix.slug == 'linux-x86_64'
        shell: bash
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.slug == 'linux-x86_64'
        with:
          node-version: '22'
      - name: Test UI models
        if: matrix.slug == 'linux-x86_64'
        run: node --test crates/api/ui-tests/*.test.mjs
      - name: Build desktop
        run: cargo build --locked --release -p studio-desktop
      - name: Package and smoke test
        shell: bash
        run: |
          archive=$(python tools/release_desktop.py package \
            --target '${{ matrix.target }}' \
            --binary 'target/release/studio-desktop${{ matrix.exe }}' \
            --output .studio-dev/release)
          python tools/release_desktop.py smoke \
            --target '${{ matrix.target }}' --archive "$archive"
      - name: Build Linux installers
        if: startsWith(matrix.slug, 'linux-')
        shell: bash
        working-directory: crates/desktop-app
        run: |
          cargo tauri build --ci --bundles appimage,deb -- --locked
          cargo tauri bundle --ci --bundles rpm --config "$(python ../../tools/release_desktop.py bundle-config rpm)"
      - name: Build macOS installer
        if: startsWith(matrix.slug, 'macos-')
        shell: bash
        working-directory: crates/desktop-app
        run: cargo tauri build --ci --bundles dmg -- --locked
      - name: Build Windows installer
        if: matrix.slug == 'windows-x86_64'
        shell: bash
        working-directory: crates/desktop-app
        run: cargo tauri build --ci --bundles msi --config "$(python ../../tools/release_desktop.py bundle-config msi)" -- --locked
      - name: Check and name installers
        shell: bash
        run: |
          python tools/release_desktop.py installers \
            --target '${{ matrix.target }}' \
            --bundle-dir target/release/bundle \
            --output .studio-dev/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.slug }}
          path: .studio-dev/release/*
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Draft GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check tag
        run: python tools/release_desktop.py version --tag "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*
          path: .studio-dev/release
          merge-multiple: true
      - name: Check all files and write checksums
        run: python tools/release_desktop.py checksums --output .studio-dev/release
      - name: Create or refresh draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          # The notes file of the candidate, then the fixed sentence (ADR 0100 item 5).
          {
            if [[ -f "docs/releases/$version.md" ]]; then
              cat "docs/releases/$version.md"
              echo
            fi
            echo "Desktop archives and installers. These files are unsigned. The server image is ghcr.io/inthemorning/studio-server:$version."
            echo
            echo "On macOS, open the DMG and move Music Index Studio to Applications. At the first start, macOS stops the app. Open System Settings, then Privacy & Security, then select Open Anyway."
            echo
            echo 'On Windows, open the MSI. If SmartScreen shows "Windows protected your PC", select More info, then Run anyway. Smart App Control can block an unsigned app. You cannot allow only this app in Smart App Control.'
          } > .studio-dev/notes.md
          if gh release view "$tag" --json isDraft --jq .isDraft > .studio-dev/draft-state; then
            if [[ "$(cat .studio-dev/draft-state)" != true ]]; then
              echo 'A published Release already uses this tag.' >&2
              exit 1
            fi
            gh release upload "$tag" .studio-dev/release/* --clobber
            gh release edit "$tag" --notes-file .studio-dev/notes.md
          else
            # A tag with a hyphen, such as v0.1.0-rc.1, is a pre-release.
            prerelease=()
            if [[ "$tag" == *-* ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$tag" .studio-dev/release/* \
              --draft --verify-tag "${prerelease[@]}" \
              --title "Music Index Studio $tag" \
              --notes-file .studio-dev/notes.md
          fi
