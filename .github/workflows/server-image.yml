name: Server image

# ADR 0066: a candidate tag builds the image of studio-server for two CPU
# types and pushes it to ghcr.io. A manual run builds both types and pushes
# nothing.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-*'

permissions:
  contents: read

jobs:
  # ADR 0066 item 7: an image builds only on a commit with a passed CI run.
  # The tag push and the main push start their runs at about the same time,
  # so this job waits for the CI run. A manual run has no tag and does not
  # wait.
  ci-passed:
    name: Wait for CI on this commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait for a passed CI run
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 60); do
            result="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push" \
              --jq '.workflow_runs[0] // {} | "\(.status // "none") \(.conclusion // "none")"')"
            status="${result% *}"
            conclusion="${result#* }"
            if [ "$status" = completed ]; then
              if [ "$conclusion" = success ]; then
                echo "CI passed on ${GITHUB_SHA}."
                exit 0
              fi
              echo "::error::ADR 0066 item 7: CI on ${GITHUB_SHA} ended with ${conclusion}. Fix main and tag a new candidate."
              exit 1
            fi
            echo "CI on ${GITHUB_SHA}: ${status}. Waiting."
            sleep 30
          done
          echo "::error::ADR 0066 item 7: no CI run on ${GITHUB_SHA} ended within 30 minutes. Push main before the candidate tag, so that CI tests the commit of the tag."
          exit 1

  # ADR 0066 item 8: the script stops when the tag and Cargo.toml differ.
  version:
    name: Read the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Read the version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$(python3 tools/release_desktop.py version --tag "$GITHUB_REF_NAME")"
          else
            version="$(python3 tools/release_desktop.py version)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  # Each type builds on a native runner, so no job emulates a CPU. Each job
  # pushes its image by digest only. The merge job gives the tag.
  build:
    name: Build image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs:
      - ci-passed
      - version
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and load the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            STUDIO_REVISION=${{ github.sha }}
            STUDIO_VERSION=${{ needs.version.outputs.version }}
          load: true
          tags: studio-server:check
          provenance: false
          sbom: false
          cache-from: type=gha,scope=studio-server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=studio-server-${{ matrix.arch }}

      # The image must start on this CPU type, and it must report the
      # version of the tag, before it goes to the registry.
      - name: Run the image
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          output="$(docker run --rm studio-server:check --version)"
          expected="Music Index Studio server ${VERSION}"
          if [ "$output" != "$expected" ]; then
            echo "::error::The image printed '${output}'. Expected '${expected}'."
            exit 1
          fi
          echo "$output"

      # The layers are in the cache, so this build does not compile again.
      - name: Push the image by digest
        id: push
        if: github.ref_type == 'tag'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            STUDIO_REVISION=${{ github.sha }}
            STUDIO_VERSION=${{ needs.version.outputs.version }}
          provenance: false
          sbom: false
          outputs: type=image,name=ghcr.io/inthemorning/studio-server,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=studio-server-${{ matrix.arch }}

      - name: Record the digest
        if: github.ref_type == 'tag'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: github.ref_type == 'tag'
        with:
          name: digests-${{ matrix.arch }}
          path: digests
          if-no-files-found: error

  merge:
    name: Tag the image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs:
      - version
      - build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A candidate image gets only its own version tag, for example
      # 0.1.0-rc.2. It never gets latest.
      - name: Join the CPU types under the version tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          image="ghcr.io/inthemorning/studio-server"
          cd digests
          digests=(*)
          if [[ "${#digests[@]}" -ne 2 ]]; then
            echo "expected 2 digests, found ${#digests[@]}" >&2
            exit 1
          fi
          refs=()
          for digest in "${digests[@]}"; do
            refs+=("${image}@sha256:${digest}")
          done
          docker buildx imagetools create -t "${image}:${VERSION}" "${refs[@]}"
          docker buildx imagetools inspect "${image}:${VERSION}"
