[workspace]
resolver = "3"
members = ["crates/core", "crates/api", "crates/server", "crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
directories = "6"
studio-core = { path = "crates/core" }
studio-api = { path = "crates/api" }
# Signing and the multipart upload body only. No default features.
rusty-s3 = { version = "0.10", default-features = false, features = ["rustcrypto", "xml"] }
# SSH client for the SFTP connector. The vendored OpenSSL needs no system library.
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
# Nostr events, keys and verification for the nsite and Blossom connectors.
# The features nip44 and nip46 give the NIP-46 messages and NIP-44 (ADR 0056 item 12).
nostr = { version = "0.45", features = ["nip44", "nip46"] }
# Signs Nostr events (ADR 0051). The version and features follow nostr.
secp256k1 = { version = "0.30", default-features = false, features = ["std"] }
# ES256 check of WebAuthn responses (ADR 0056 item 26).
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
# QR code as SVG for the nostrconnect address (ADR 0056 item 13).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# WebSocket client for relays, and the test relay.
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Argon2 is too slow without optimization for the vault tests.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
