[package]
name = "studio-api"
description = "JSON API over the musicindex-studio core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test doubles for the shells. A release build does not use it.
testing = []

[dependencies]
directories.workspace = true
axum = "0.8"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
studio-core.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "fs", "io-util"] }
zeroize = "1.9"
uuid = { version = "1.28", features = ["v4"] }
qrcode.workspace = true

[dev-dependencies]
studio-core = { workspace = true, features = ["testing"] }
nostr.workspace = true
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
