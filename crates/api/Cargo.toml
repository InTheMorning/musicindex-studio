[package]
name = "studio-api"
description = "JSON API over the musicindex-studio core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test doubles for the shells. A release build does not use it.
testing = []

[dependencies]
directories.workspace = true
axum = "0.8"
futures-util = { version = "0.3", default-features = false }
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
studio-core.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "fs", "io-util"] }
zeroize = { version = "1.9", features = ["serde"] }
uuid = { version = "1.28", features = ["v4"] }
qrcode.workspace = true

[dev-dependencies]
studio-core = { workspace = true, features = ["testing"] }
# The API tests of /app/v1/ use the client crate (ADR 0110 item 30).
studio-app-client = { path = "../app-client" }
sha2 = "0.11"
base64 = "0.23"
nostr.workspace = true
http-body-util = "0.1"
rusqlite = { version = "0.40", features = ["bundled"] }
tar.workspace = true
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
