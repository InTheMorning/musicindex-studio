[package]
name = "studio-core"
description = "Feed model, connectors, vault and write pipeline for musicindex-studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
directories.workspace = true
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
base64 = "0.23"
chacha20poly1305 = "0.11"
getrandom = "0.4"
hkdf = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
similar = { version = "3", features = ["inline"] }
musicindex-search = { git = "https://github.com/InTheMorning/musicindex-lib", rev = "11d99e593847fb3d61b175032ce3e9fbad690022" }
ureq = "3.5"
quick-xml = "0.42"
rusty-s3.workspace = true
ssh2.workspace = true
nostr.workspace = true
secp256k1.workspace = true
tungstenite.workspace = true
tar.workspace = true
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
uuid = { version = "1.28", features = ["v4", "v5"] }
zeroize = "1.9"
zxcvbn = { version = "3.1", default-features = false }
lofty = { version = "0.25", default-features = false, features = [
    "id3v2_compression_support",
] }
hound = { version = "3.5", default-features = false }
flacenc = { version = "0.5", default-features = false }
mp3lame-encoder = "0.2"
claxon = "0.4"
fs4 = "1.1"

[features]
# Test helpers for the tests of other workspace crates.
testing = []

[dev-dependencies]
# The integration tests use the test servers.
studio-core = { path = ".", features = ["testing"] }
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", features = ["process"] }

[lints]
workspace = true
