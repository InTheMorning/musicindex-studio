[package]
name = "studio-core"
description = "Feed model, connectors, vault and write pipeline for musicindex-studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
base64 = "0.23"
chacha20poly1305 = "0.11"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.42"
uuid = { version = "1.28", features = ["v4", "v5"] }
zeroize = "1.9"

[lints]
workspace = true
