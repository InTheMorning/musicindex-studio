[package]
name = "studio-desktop-app"
description = "Tauri desktop app of musicindex-studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "studio-desktop-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
directories.workspace = true
studio-desktop = { path = "../desktop" }
tauri = { version = "2", features = ["tray-icon"] }
# The single instance plugin must be the first plugin (ADR 0124 item 10).
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync", "time"] }
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
serde_json = "1"
# The ksni backend gives the left click of the tray icon (ADR 0124 item 8).
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
# The bus tells if a tray host runs (ADR 0124 item 29).
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
