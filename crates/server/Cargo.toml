[package]
name = "studio-server"
description = "Public server shell for musicindex-studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8"
getrandom = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
studio-api.workspace = true
studio-core.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "fs", "time"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
studio-core = { workspace = true, features = ["testing"] }
http-body-util = "0.1"
tempfile = "3"

[lints]
workspace = true
